<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password &amp; Account Recovery | Devengers</title>
    <meta name="description" content="Reset your Devengers account password securely using 6-digit email OTP verification.">
    <meta name="keywords" content="Devengers Forgot Password, Reset Password, Account Recovery, Devengers Auth">
    <meta name="author" content="Devengers Community">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#7B42F6">
    <link rel="canonical" href="https://devengers.org/forgot-password">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=3">
    <link rel="apple-touch-icon" href="favicon.png?v=3">

    <!-- Tailwind CSS (via CDN for local dev) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS & Auth Helper -->
    <link rel="stylesheet" href="style.css?v=4">
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <style>
        .bg-grid {
            background-color: #1a1a1a;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 80px 80px;
            background-position: center center;
        }
        .form-input {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: white;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: #7B42F6;
            outline: none;
        }
        .shadow-brutal {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
    </style>
</head>
<body class="bg-grid m-0 p-0 overflow-x-hidden antialiased text-white min-h-screen flex flex-col justify-center relative">
    
    <!-- NAVIGATION (Fixed) -->
    <nav class="devengers-navbar-fixed fixed top-6 left-0 w-full z-50 flex justify-center px-4">
        <div class="devengers-navbar-notch bg-[#7B42F6] shadow-brutal border-4 border-black rounded-full px-6 md:px-8 py-3 w-full max-w-[1400px] flex items-center justify-between">
            <!-- Logo -->
            <a href="index.html" class="flex items-center group select-none" title="Devengers Home">
                <div class="devengers-nav-logo font-black text-2xl md:text-[30px] tracking-tighter uppercase rounded-full transition-transform duration-300"
                    style="-webkit-text-stroke: 2px black; color: #CDFF29; text-shadow: 3px 3px 0px black; line-height: 1;">
                    <span class="devengers-badge-icon">
                        <svg class="w-3.5 h-3.5 text-[#CDFF29]" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                        </svg>
                    </span>
                    <span class="logo-char">D</span><span class="logo-char">E</span><span class="logo-char">V</span><span class="logo-char">E</span><span class="logo-char">N</span><span class="logo-char">G</span><span class="logo-char">E</span><span class="logo-char">R</span><span class="logo-char">S</span>
                </div>
            </a>

            <!-- Center Links -->
            <div class="hidden md:flex gap-6 lg:gap-8 text-[11px] font-bold uppercase tracking-widest text-white/80">
                <a href="events.html" class="nav-link">Events</a>
                <a href="learn.html" class="nav-link">Learn</a>
                <a href="campus.html" class="nav-link">Campus Resource</a>
                <a href="dsa.html" class="nav-link">DSA Streak</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="certificates.html" class="nav-link">Certificates</a>
            </div>

            <!-- Right Links & Action Buttons -->
            <div class="flex items-center gap-3 sm:gap-4">
                <button type="button" onclick="window.DevengersTheme.toggleTheme()" class="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
                    <div class="toggle-thumb">🌙</div>
                </button>
                <a href="login.html" class="hidden md:block text-[11px] font-bold uppercase tracking-widest text-white/80 hover:text-white transition-colors">LOGIN</a>
                <a href="register.html" class="bg-white text-black px-5 py-2 rounded-full text-[11px] font-bold uppercase tracking-widest hover:bg-[#CDFF29] transition-colors flex items-center gap-1.5 shadow-sm">
                    SIGN UP <span class="font-normal text-sm leading-none">&rarr;</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- MAIN RECOVERY CONTENT -->
    <main class="w-full max-w-md mx-auto px-4 sm:px-6 pt-28 sm:pt-36 pb-16 flex flex-col items-center">
        
        <!-- Header Badge & Heading -->
        <div class="inline-block bg-[#7B42F6]/20 border border-[#7B42F6]/50 text-[#CDFF29] text-[10px] font-mono font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-3">
            🔑 Account Recovery
        </div>
        <h1 class="font-black text-3xl sm:text-4xl md:text-5xl text-white uppercase tracking-tighter leading-none drop-shadow-lg mb-2 text-center">FORGOT PASSWORD</h1>
        <p class="text-gray-400 text-xs font-mono mb-6 text-center">Enter your registered email to receive a 6-digit reset code.</p>
        
        <!-- Error Banner -->
        <div id="reset-error" class="hidden w-full mb-4 p-4 rounded-xl bg-red-950/70 border border-red-500/60 text-red-200 text-xs font-mono flex items-center gap-2"></div>

        <!-- Success Banner -->
        <div id="reset-success" class="hidden w-full mb-4 p-4 rounded-xl bg-green-950/70 border border-green-500/60 text-green-200 text-xs font-mono flex items-center gap-2"></div>

        <!-- Form Card -->
        <div class="w-full bg-[#18181c] border-2 border-white/20 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-brutal">
            <form id="reset-form" onsubmit="handleResetSubmit(event)" class="w-full flex flex-col gap-4">
                
                <!-- Email Address -->
                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-mono tracking-widest text-gray-400 uppercase">
                            REGISTERED EMAIL <span class="text-red-500">*</span>
                        </label>
                        <span id="reset-timer-label" class="hidden text-[10px] font-mono text-[#CDFF29]">Code Sent</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="email" id="reset-email" class="form-input rounded-xl px-4 py-3 flex-1 text-sm" placeholder="student@devengers.org" required autofocus>
                        <button type="button" id="btn-send-code" onclick="handleSendResetOtp()" class="bg-[#7B42F6] hover:bg-[#6c35e4] text-white px-4 py-3 rounded-xl text-xs font-mono font-bold uppercase tracking-wider transition-all cursor-pointer whitespace-nowrap shadow-sm border border-purple-400/40">
                            Send Code
                        </button>
                    </div>
                </div>

                <!-- 6-Digit OTP Code -->
                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-mono tracking-widest text-[#CDFF29] uppercase font-bold flex items-center gap-1.5">
                            <span>⚡</span> 6-DIGIT VERIFICATION CODE <span class="text-red-500">*</span>
                        </label>
                        <button type="button" id="btn-resend-code" onclick="handleSendResetOtp()" class="hidden text-[10px] font-mono text-gray-400 hover:text-white uppercase underline cursor-pointer">
                            Resend Code
                        </button>
                    </div>
                    <input type="text" id="reset-otp" maxlength="6" pattern="\d{6}" placeholder="Enter 6-digit code" class="form-input rounded-xl px-4 py-3 w-full text-center tracking-[0.4em] font-mono text-lg font-bold border-[#CDFF29]/70 focus:border-[#CDFF29]" required>
                    <p class="text-[10px] font-mono text-gray-400">Valid for 10 minutes. Check Spam/Promotions if not in inbox.</p>
                </div>

                <!-- New Password -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-mono tracking-widest text-gray-400 uppercase">
                        NEW PASSWORD (MIN 6 CHARS) <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="reset-password" minlength="6" class="form-input rounded-xl px-4 py-3 w-full pr-12 text-sm" placeholder="••••••••" required>
                        <button type="button" onclick="toggleVisibility('reset-password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors cursor-pointer" aria-label="Toggle password visibility">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-mono tracking-widest text-gray-400 uppercase">
                        CONFIRM NEW PASSWORD <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="reset-confirm-password" minlength="6" class="form-input rounded-xl px-4 py-3 w-full text-sm" placeholder="••••••••" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-reset-submit" class="bg-[#CDFF29] hover:bg-white text-black font-bold uppercase tracking-widest text-sm px-8 py-4 rounded-full w-full mt-2 transition-all shadow-xl cursor-pointer">
                    RESET PASSWORD &rarr;
                </button>
            </form>
        </div>

        <!-- Back to Login Navigation -->
        <p class="mt-8 text-sm text-gray-400">
            Remembered your password? <a href="login.html" class="text-white font-bold hover:underline">Back to Login</a>
        </p>

    </main>

    <script>
        let countdownTimer = null;

        function toggleVisibility(inputId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function handleSendResetOtp() {
            const email = document.getElementById('reset-email').value.trim();
            const errBox = document.getElementById('reset-error');
            const succBox = document.getElementById('reset-success');
            const sendBtn = document.getElementById('btn-send-code');
            const resendBtn = document.getElementById('btn-resend-code');
            const timerLabel = document.getElementById('reset-timer-label');

            errBox.classList.add('hidden');
            succBox.classList.add('hidden');

            if (!email || !email.includes('@')) {
                errBox.textContent = 'Please enter a valid registered email address.';
                errBox.classList.remove('hidden');
                document.getElementById('reset-email').focus();
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            const res = await window.DevengersAuth.sendPasswordResetOtp(email);

            if (res.success) {
                succBox.textContent = res.message || `✓ 6-digit verification passcode dispatched to ${email}`;
                succBox.classList.remove('hidden');
                document.getElementById('reset-otp').focus();
                resendBtn.classList.remove('hidden');

                // 60-second cooldown
                let remaining = 60;
                sendBtn.disabled = true;
                resendBtn.disabled = true;
                timerLabel.classList.remove('hidden');
                sendBtn.textContent = `Sent (${remaining}s)`;

                clearInterval(countdownTimer);
                countdownTimer = setInterval(() => {
                    remaining--;
                    if (remaining <= 0) {
                        clearInterval(countdownTimer);
                        sendBtn.disabled = false;
                        sendBtn.textContent = 'Send Code';
                        resendBtn.disabled = false;
                        resendBtn.textContent = 'Resend Code';
                        timerLabel.classList.add('hidden');
                    } else {
                        sendBtn.textContent = `Sent (${remaining}s)`;
                        resendBtn.textContent = `Resend (${remaining}s)`;
                    }
                }, 1000);
            } else {
                errBox.textContent = res.error || 'Failed to send reset code. Please check your email and try again.';
                errBox.classList.remove('hidden');
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Code';
            }
        }

        async function handleResetSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value.trim();
            const otp = document.getElementById('reset-otp').value.trim();
            const newPwd = document.getElementById('reset-password').value;
            const confirmPwd = document.getElementById('reset-confirm-password').value;
            const errBox = document.getElementById('reset-error');
            const succBox = document.getElementById('reset-success');
            const submitBtn = document.getElementById('btn-reset-submit');

            errBox.classList.add('hidden');
            succBox.classList.add('hidden');

            if (!email || !email.includes('@')) {
                errBox.textContent = 'Please enter your registered email address.';
                errBox.classList.remove('hidden');
                return;
            }

            if (!otp || otp.length !== 6) {
                errBox.textContent = 'Please enter the 6-digit verification code sent to your email.';
                errBox.classList.remove('hidden');
                document.getElementById('reset-otp').focus();
                return;
            }

            if (!newPwd || newPwd.length < 6) {
                errBox.textContent = 'New password must be at least 6 characters.';
                errBox.classList.remove('hidden');
                document.getElementById('reset-password').focus();
                return;
            }

            if (newPwd !== confirmPwd) {
                errBox.textContent = 'Passwords do not match.';
                errBox.classList.remove('hidden');
                document.getElementById('reset-confirm-password').focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'RESETTING PASSWORD...';

            const res = await window.DevengersAuth.resetPassword(email, otp, newPwd, confirmPwd);

            if (res.success) {
                succBox.textContent = '✓ Password reset successfully! Redirecting to login page...';
                succBox.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = `login.html?email=${encodeURIComponent(email)}&reset=success`;
                }, 1200);
            } else {
                errBox.textContent = res.error || 'Failed to reset password. Please check your verification code.';
                errBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'RESET PASSWORD →';
            }
        }

        // Auto-fill email if passed in query param
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        if (emailParam) {
            document.getElementById('reset-email').value = emailParam;
        }
    </script>
</body>
</html>
